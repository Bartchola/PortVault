# Cria o instalador do Windows automaticamente toda vez que você criar uma tag (ex: v0.1.0)
name: Release

on:
  push:
    tags: ['v*']

# Permissão de escrita: o passo "Publicar na Release" precisa criar a Release
# e subir os .exe. Sem isso o GitHub dá apenas "Contents: read" e falha.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar instalador
        run: npm run dist

      - name: Publicar na Release
        uses: softprops/action-gh-release@v2
        with:
          # *.exe = instaladores; *.blockmap + latest.yml = usados pelo
          # electron-updater pra baixar atualizações dentro do launcher
          # (o blockmap permite download diferencial = mais rápido).
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          draft: false
          prerelease: false
          generate_release_notes: true
